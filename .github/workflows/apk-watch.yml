# 手表适配分支的 APK 构建：GitHub 上出 arm64 安装包（不发布 Release）。
#
# 上游 ci.yml 只跑单测，不出包；出包要两段：
#   1. runtime/build-runtime.sh arm64-v8a   → runtime/out/arm64-v8a（rootfs + proot）
#   2. tooling/build-apk.sh                 → app/build/app/outputs/flutter-apk/*.apk
# gradlew 不在仓库里（上游用 gradle/actions/setup-gradle 提供 Gradle），
# 所以先 `gradle wrapper` 把 wrapper 生出来，构建脚本才能调 ./gradlew。
name: APK (watch)

on:
  workflow_dispatch:
  push:
    branches: [watch]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  # 表盘上跑的这版：版本名带上 watch，装到同一台机器上能看出是哪个包。
  APP_VERSION: 1.0.14-watch.1

jobs:
  # 便宜的一步先跑：Dart 编译错误、未用 import 在这里就拦住，不白花十几分钟构建引擎。
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub

  apk:
    name: arm64 APK
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DSH_MAVEN_MIRRORS: 0 # The Aliyun mirrors are slow and unreliable from a US runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 引擎（rootfs + proot）不在这里现做：runtime/build-runtime.sh 要按镜像索引
      # 现下 Ubuntu 包，镜像一换版本号就是 404（上游 CI 也只跑引擎单测，发布包是本机打的）。
      # 这次只改 Flutter 界面层，引擎用官方 release 里已经打好的那份，字节一致：
      # 从 194MB 的 APK 里取出 assets/runtime/ 与 lib/arm64-v8a/ 下的 proot 四件套，
      # 放进 gradle 期望的 runtime/out/arm64-v8a/（app/android/app/build.gradle.kts:70-76）。
      - name: Take the engine from the upstream release
        run: |
          set -euo pipefail
          url="https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.13/dsh-go-1.0.13-arm64.apk"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/upstream.apk" "$url"
          out=runtime/out/arm64-v8a
          rm -rf "$out"
          mkdir -p "$out/assets" "$out/jniLibs/arm64-v8a"
          unzip -q -o "$RUNNER_TEMP/upstream.apk" \
            'assets/runtime/*' \
            'lib/arm64-v8a/libproot.so' \
            'lib/arm64-v8a/libproot-loader.so' \
            'lib/arm64-v8a/libtalloc.so' \
            'lib/arm64-v8a/libandroid-shmem.so' \
            -d "$RUNNER_TEMP/upstream"
          cp -R "$RUNNER_TEMP/upstream/assets/runtime" "$out/assets/"
          cp "$RUNNER_TEMP"/upstream/lib/arm64-v8a/libproot.so \
             "$RUNNER_TEMP"/upstream/lib/arm64-v8a/libproot-loader.so \
             "$RUNNER_TEMP"/upstream/lib/arm64-v8a/libtalloc.so \
             "$RUNNER_TEMP"/upstream/lib/arm64-v8a/libandroid-shmem.so \
             "$out/jniLibs/arm64-v8a/"
          test -s "$out/assets/runtime/manifest.json"
          du -sh "$out"/*
          ls -l "$out/jniLibs/arm64-v8a"

      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # gradlew is not tracked upstream; without it `flutter build apk` has no wrapper to run.
      - name: Generate the Gradle wrapper
        working-directory: app/android
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin -q

      - name: Build the APK
        run: tooling/build-apk.sh --build-name "$APP_VERSION"

      - name: Checksums
        run: |
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          ls -l "$apk"
          sha256sum "$apk" | tee apk-sha256.txt

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          tag="watch-${{ github.run_number }}"
          gh release create "$tag" "$apk#dsh-go-watch-arm64.apk" \
            --title "dsh-go 手表版 $tag" \
            --notes "手表适配构建：294dp 方屏排版缩放、强制轻量档、启动路径精简。引擎取自 v1.0.13 官方包。sha256 见附件旁的 apk-sha256.txt。" \
            --latest=false || gh release upload "$tag" "$apk#dsh-go-watch-arm64.apk" --clobber
          gh release upload "$tag" apk-sha256.txt --clobber || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-go-watch-arm64
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-release.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
