# reverse temp branch only (request core20-056). Not product; never merged; ci.yml untouched.
# One Linux job: tree A (base + TESTONLY) prepare -> one node --test -> gate (expected semantic red)
# -> tree B (base + FULL) prepare -> one node --test. Each tree is a fresh detached worktree at the base.
name: reverse core20 056

on:
  push:
    branches: [reverse/core20-056]

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.1

defaults:
  run:
    shell: bash

jobs:
  media:
    name: Request 056 media A then B
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: 3a91fab9e80d2a92be071a74b8b208214d7e6277
      R: .github/reverse-056
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Toolchain (report only)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          echo "CHECKOUT_HEAD=$(git rev-parse HEAD) PARENTS=$(git log -1 --format=%P)"
          echo "NODE $(node --version) NPM $(npm --version) PYTHON $(python3 --version 2>&1) $(git --version)"
          echo "NODE_BIN $(command -v node) PYTHON_BIN $(command -v python3)"
          uname -srmv
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo "HOME=$HOME RUNNER_TEMP=$RUNNER_TEMP TZ=${TZ-unset} TMPDIR=${TMPDIR-unset} DSH_HOME=${DSH_HOME-unset} UID=$(id -u) USER=$(id -un)"
          echo "NPM_REGISTRY=$(npm config get registry) NPM_CACHE=$(npm config get cache)"
          exit 0
      - name: Raw patch identity (copied out of tree)
        run: |
          set +e
          mkdir "$RUNNER_TEMP/raw" || exit 1
          cp "$R/2602-media-secret-original-strings-LF.patch" "$R/2602-TESTONLY-media-secret-original-strings-LF.patch" "$RUNNER_TEMP/raw/" || exit 1
          cp "$R/ident056.py" "$R/tap056.py" "$RUNNER_TEMP/" || exit 1
          python3 -I "$RUNNER_TEMP/ident056.py" raw "$RUNNER_TEMP/raw"
      - name: Prepare A (base + TESTONLY)
        id: prepA
        run: bash "$R/prep056.sh" A 2602-TESTONLY-media-secret-original-strings-LF.patch
      - name: Test A (the only A node --test)
        id: testA
        if: steps.prepA.outcome == 'success'
        run: bash "$R/test056.sh" A
      - name: Gate A (continue to B only on the expected Missing expected rejection red)
        id: gateA
        if: steps.testA.outcome == 'success'
        run: python3 -I "$RUNNER_TEMP/tap056.py" gateA "$RUNNER_TEMP/out/A-node-test.stdout" "${{ steps.testA.outputs.rc }}" "$RUNNER_TEMP/tree-A/runtime/media/dsh-media/test/media-v2.test.js"
      - name: Prepare B (independent base + FULL)
        id: prepB
        if: steps.gateA.outcome == 'success'
        run: bash "$R/prep056.sh" B 2602-media-secret-original-strings-LF.patch
      - name: Test B (the only B node --test, whole file)
        id: testB
        if: steps.prepB.outcome == 'success'
        run: bash "$R/test056.sh" B
      - name: Summary B (report only)
        if: steps.testB.outcome == 'success'
        run: python3 -I "$RUNNER_TEMP/tap056.py" summary "$RUNNER_TEMP/out/B-node-test.stdout" "${{ steps.testB.outputs.rc }}" "$RUNNER_TEMP/tree-B/runtime/media/dsh-media/test/media-v2.test.js"
      - name: Upload request 056 outputs (reverse temp branch only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-056-outputs
          path: ${{ runner.temp }}/out
