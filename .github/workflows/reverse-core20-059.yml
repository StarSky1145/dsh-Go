# reverse temp branch only (request core20-059). Not product; never merged; ci.yml untouched.
# One Linux job: tree A (base + TESTONLY) -> A1 -> gate -> A2 -> gate -> tree B (base + FULL) -> B1 -> gate -> B2.
# No npm/pnpm, no node_modules, no DSH_PREFIX. Each tree is a fresh detached worktree at the base.
name: reverse core20 059

on:
  push:
    branches: [reverse/core20-059]

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.1

defaults:
  run:
    shell: bash

jobs:
  bridge:
    name: Request 059 bridge clock A1 A2 B1 B2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: 3a91fab9e80d2a92be071a74b8b208214d7e6277
      R: .github/reverse-059
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Tool cache before setup-node (report only)
        run: |
          set +e
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "NODE_TOOL_CACHE_ENTRIES_BEFORE:"; ls -1 "$RUNNER_TOOL_CACHE/node" 2>&1
          [ -d "$RUNNER_TOOL_CACHE/node/24.22.1" ] && echo "NODE_24_22_1_PRESENT_BEFORE=yes" || echo "NODE_24_22_1_PRESENT_BEFORE=no"
          echo "PATH_NODE_BEFORE=$(command -v node) $(node --version 2>&1)"
          exit 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setupnode
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Toolchain (report only)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          echo "SETUP_NODE_OUTPUT node-version=${{ steps.setupnode.outputs.node-version }} cache-hit=${{ steps.setupnode.outputs.cache-hit }}"
          echo "NODE_TOOL_CACHE_ENTRIES_AFTER:"; ls -1 "$RUNNER_TOOL_CACHE/node" 2>&1
          echo "CHECKOUT_HEAD=$(git rev-parse HEAD) PARENTS=$(git log -1 --format=%P)"
          git log -2 --format='COMMIT %H parents=%P author=%an <%ae> %s'
          echo "NODE $(node --version) NPM_NOT_USED PYTHON $(python3 --version 2>&1) $(git --version)"
          echo "NODE_BIN $(command -v node) PYTHON_BIN $(command -v python3)"
          uname -srmv
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo "HOME=$HOME RUNNER_TEMP=$RUNNER_TEMP TZ=${TZ-unset} TMPDIR=${TMPDIR-unset} DSH_HOME=${DSH_HOME-unset} DSH_PREFIX=${DSH_PREFIX-unset} UID=$(id -u) USER=$(id -un)"
          exit 0
      - name: Raw patch identity (copied out of tree)
        run: |
          set +e
          mkdir "$RUNNER_TEMP/raw" || exit 1
          cp "$R/2605-capability-monotonic-pacing-LF.patch" "$R/2605-TESTONLY-capability-monotonic-pacing-LF.patch" "$RUNNER_TEMP/raw/" || exit 1
          cp "$R/ident059.py" "$R/tap059.py" "$RUNNER_TEMP/" || exit 1
          python3 -I "$RUNNER_TEMP/ident059.py" raw "$RUNNER_TEMP/raw"
      - name: Prepare A (base + TESTONLY)
        id: prepA
        run: bash "$R/prep059.sh" A 2605-TESTONLY-capability-monotonic-pacing-LF.patch
      - name: A1 (only command)
        id: A1
        if: steps.prepA.outcome == 'success'
        run: bash "$R/test059.sh" A1
      - name: Gate A1 (exactly R1/R2 semantic reds)
        id: gA1
        if: steps.A1.outcome == 'success'
        run: python3 -I "$RUNNER_TEMP/tap059.py" A1 "$RUNNER_TEMP/out/A1-node-test.stdout" "${{ steps.A1.outputs.rc }}"
      - name: A2 (only command)
        id: A2
        if: steps.gA1.outcome == 'success'
        run: bash "$R/test059.sh" A2
      - name: Gate A2 (5 pass)
        id: gA2
        if: steps.A2.outcome == 'success'
        run: python3 -I "$RUNNER_TEMP/tap059.py" A2 "$RUNNER_TEMP/out/A2-node-test.stdout" "${{ steps.A2.outputs.rc }}"
      - name: Prepare B (independent base + FULL)
        id: prepB
        if: steps.gA2.outcome == 'success'
        run: bash "$R/prep059.sh" B 2605-capability-monotonic-pacing-LF.patch
      - name: B1 (only command)
        id: B1
        if: steps.prepB.outcome == 'success'
        run: bash "$R/test059.sh" B1
      - name: Gate B1 (10 pass)
        id: gB1
        if: steps.B1.outcome == 'success'
        run: python3 -I "$RUNNER_TEMP/tap059.py" B1 "$RUNNER_TEMP/out/B1-node-test.stdout" "${{ steps.B1.outputs.rc }}"
      - name: B2 (only command)
        id: B2
        if: steps.gB1.outcome == 'success'
        run: bash "$R/test059.sh" B2
      - name: Gate B2 (two named cases pass)
        id: gB2
        if: steps.B2.outcome == 'success'
        run: python3 -I "$RUNNER_TEMP/tap059.py" B2 "$RUNNER_TEMP/out/B2-node-test.stdout" "${{ steps.B2.outputs.rc }}"
      - name: Upload request 059 outputs (reverse temp branch only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-059-outputs
          path: ${{ runner.temp }}/out
